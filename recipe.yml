name: Varbase AI Base
description: A base recipe to install core AI modules and apply default Varbase AI configurations including OpenAI integration, image alt text generation, and CKEditor AI assistant.
type: Varbase AI
install:
  - ai
  - eca
  - ai_integration_eca
recipes:
  - drupal_cms_ai
  - varbase_ai_image_alt
  - varbase_ai_editor_assistant
input:
  _form_trigger:
    data_type: string
    description: 'Internal trigger to ensure the recipe input form is displayed so sub-recipe inputs are collected.'
    form:
      '#type': 'hidden'
      '#value': '1'
    default:
      source: value
      value: '1'
config:
  strict: false
