name: Varbase AI Base
description: A base recipe to install core AI modules and apply default Varbase AI configurations including OpenAI integration, image alt text generation, and CKEditor AI assistant.
type: Varbase AI
install:
  - ai
  - eca
  - ai_integration_eca
recipes:
  - drupal_cms_ai
  - varbase_ai_image_alt
  - varbase_ai_editor_assistant
  - varbase_ai_taxonomy_tagging
input:
  _form_trigger:
    data_type: string
    description: 'Internal trigger to ensure the recipe input form is displayed so sub-recipe inputs are collected.'
    form:
      '#type': 'hidden'
      '#value': '1'
    default:
      source: value
      value: '1'
config:
  strict: false
  actions:
    ai_agents.ai_agent.drupal_cms_assistant:
      simpleConfigUpdate:
        tools:
          'ai_agents::ai_agent::canvas_ai_orchestrator': true
          'ai_agents::ai_agent::canvas_component_agent': true
          'ai_agents::ai_agent::canvas_metadata_generation_agent': true
          'ai_agents::ai_agent::canvas_page_builder_agent': true
          'ai_agents::ai_agent::canvas_template_builder_agent': true
          'ai_agents::ai_agent::canvas_title_generation_agent': true
          'ai_agents::ai_agent::content_type_agent_triage': true
          'ai_agents::ai_agent::field_agent_triage': true
          'ai_agents::ai_agent::taxonomy_agent_config': true
